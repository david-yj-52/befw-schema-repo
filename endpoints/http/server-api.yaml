openapi: "3.1.0"
info:
  title: TSH Server API
  version: "1.0.0"

components:
  schemas:
    MessageHead:
      $ref: "../../schemas/common/message-head.yaml"
    ServerSampleMessage:        # ← 이게 클래스명이 됩니다
      $ref: "../../schemas/messages/server-sample-message.yaml"

paths:
  /api/server/message:
    post:
      summary: Agent → Server 메시지 수신
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerSampleMessage"  # ← components 참조
      responses:
        "200":
          description: 성공
        "400":
          description: 스키마 검증 실패