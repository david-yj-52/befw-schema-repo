MessageBodyBase:
  type: object
  required: [tenant, userId]
  properties:
    tenant: {type: string}
    userId: {type: string}


MessageBodyManufacture:
  allOf:
    - $ref: "#/MessageBodyBase"
  type: object
  properties:
    lotId: {type: string}
    eqpId: {type: string}
    carrId: {type: string}
    portId: {type: string}

MessageBodyCommerce:
  allOf:
    - $ref: "#/MessageBodyBase"
  type: object
  properties:
    prodId: {type: string}
    prodNm: {type: string}