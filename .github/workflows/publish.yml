# .github/workflows/publish.yml
on:
  push:
    branches: [main]
#    paths: ["schemas/**"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # ← GitHub Packages 업로드 권한 필수

    steps:
      - uses: actions/checkout@v4

      # ──────────────── Java ────────────────
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          # ← settings.xml 없이 여기서 GitHub Packages 설정
          distribution: 'temurin'
          server-id: github
#          server-username: GITHUB_ACTOR
#          server-password: GITHUB_TOKEN

      - name: Publish Java (Maven → GitHub Packages)
        run: mvn deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # ← 별도 secret 불필요, 자동 제공

      # ──────────────── Python ────────────────
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4        # ← quicktype을 위해 Node 먼저 설치
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'

      - name: Generate Python models
        run: |
          mkdir -p tsh_schema
          npm install -g quicktype          # ← pip install 아닌 npm install로 변경
          quicktype schemas/ -l python -o tsh_schema/__init__.py

      - name: Publish Python (→ GitHub Packages PyPI)
        run: |
          pip install twine build
          python -m build
          twine upload \
            --repository-url https://maven.pkg.github.com/david-yj-52/${{ github.event.repository.name }} \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            dist/*

      # ──────────────── npm ────────────────
      # setup-node는 위로 올렸으므로 여기선 제거

      - name: Generate TypeScript types
        run: |
          npm install
          npm run generate
          npm run build

      - name: Publish npm (→ GitHub Packages)
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}