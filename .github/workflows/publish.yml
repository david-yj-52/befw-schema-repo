# .github/workflows/publish.yml
on:
  push:
    branches: [main]
    paths: ["schemas/**", ".github/**"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # ← Releases 업로드를 위해 read → write 변경
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ──────────────── Java ────────────────
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR      # ← 주석 해제
          server-password: GITHUB_TOKEN      # ← 주석 해제

      - name: Publish Java (Maven → GitHub Packages)
        run: mvn deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ──────────────── Python ────────────────
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'

      - name: Generate Python models
        run: |
          mkdir -p tsh_schema
          npm install -g quicktype
          quicktype schemas/ -l python -o tsh_schema/__init__.py

      - name: Build Python package
        run: |
          pip install build
          python -m build

      - name: Publish Python (→ GitHub Releases)   # ← PyPI → Releases 로 변경
        uses: softprops/action-gh-release@v2
        with:
          tag_name: schema-${{ github.sha }}
          name: Schema ${{ github.sha }}
          files: dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ──────────────── npm ────────────────
      - name: Generate TypeScript types
        run: |
          npm install
          npm run generate
          npm run build
      - name: Set npm version
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)           # 예: 20260405195701
          npm version "1.0.0-$TIMESTAMP" --no-git-tag-version 

      - name: Publish npm (→ GitHub Packages)
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}